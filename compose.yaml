services:
  postgres:
    build:
      context: .
      dockerfile: infra/database/postgres/Dockerfile
    container_name: nekobox-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nekobox}
      POSTGRES_USER: ${POSTGRES_USER:-nekobox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nekobox_local}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - nekobox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    container_name: nekobox-api
    environment:
      BD_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nekobox}
      BD_ADMIN: ${POSTGRES_USER:-nekobox}
      BD_SENHA: ${POSTGRES_PASSWORD:-nekobox_local}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_MEDIA_ROOT: ${CLOUDINARY_MEDIA_ROOT:-nekobox/games}
      CLOUDINARY_SCREENSHOT_COUNT: ${CLOUDINARY_SCREENSHOT_COUNT:-10}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=/dev/null http://127.0.0.1:8080/api/games?size=1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_MEDIA_AUDIT: ${VITE_CLOUDINARY_MEDIA_AUDIT:-true}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    container_name: nekobox-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=/dev/null http://127.0.0.1:8080/
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  nekobox-postgres-data:
